# nginx.conf específico para Kubernetes. Substitui, no pod, o ficheiro que
# está dentro da imagem (que usa o DNS do Docker, 127.0.0.11, e só funciona
# no docker-compose). Assim o docker-compose continua a funcionar sem mudanças.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: movie-app
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # DNS do cluster (CoreDNS). Se nginx não arrancar com este nome,
        # usa o IP do serviço: kubectl get svc -n kube-system kube-dns
        # (por omissão com kubeadm: 10.96.0.10)
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

        # IMPORTANTE: o resolver do nginx NÃO usa a "search list" do
        # resolv.conf, por isso "user:8000" não resolve. Tem de ser o nome completo.
        location /api/user/ {
            set $user_service user.movie-app.svc.cluster.local:8000;
            proxy_pass http://$user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/recommendations/ {
            set $recommendations_service recommendations.movie-app.svc.cluster.local:8000;
            proxy_pass http://$recommendations_service;
            proxy_read_timeout 210s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/movies {
            set $catalog_service catalog.movie-app.svc.cluster.local:8000;
            proxy_pass http://$catalog_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: movie-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: jarmela/frontend:v1
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: movie-app
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
