apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendations
  namespace: movie-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: recommendations
  template:
    metadata:
      labels:
        app: recommendations
    spec:
      containers:
        - name: recommendations
          image: jarmela/recommendations:v1
          ports:
            - containerPort: 8000
          env:
            # Mesmos valores do docker-compose. Os nomes "user" e "catalog"
            # são os metadata.name dos Services (mesmo namespace).
            - name: USER_SERVICE_URL
              value: "http://user:8000"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog:8000"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "5"
            - name: INFERENCE_SERVICE_URL
              value: "http://inference:8080"
            - name: INFERENCE_MODEL
              value: "movie-qwen"
            - name: INFERENCE_TIMEOUT_SECONDS
              value: "90"
            - name: RECOMMENDATIONS_DB_PATH
              value: "/app/data/recommendations.sqlite3"
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-api
                  key: token
          volumeMounts:
            - name: recommendations-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: recommendations-data
          persistentVolumeClaim:
            claimName: recommendations-data
---
apiVersion: v1
kind: Service
metadata:
  name: recommendations
  namespace: movie-app
spec:
  type: ClusterIP
  selector:
    app: recommendations
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recommendations-data
  namespace: movie-app
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
