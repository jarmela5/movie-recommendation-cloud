server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Plain static pages, no client-side router: a missing file is a 404
    # rather than a copy of index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    # Docker's internal DNS. Combined with the variable in proxy_pass below it
    # makes nginx resolve the service name per request instead of at startup,
    # so this container can boot before the user service is up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Each microservice gets one location block. The service owns the whole
    # /api/user/ prefix, so there is no path rewriting to reason about.
    location /api/user/ {
        set $user_service user:8000;
        proxy_pass http://$user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/recommendations/ {
        proxy_read_timeout 210s;
        set $recommendations_service recommendations:8000;
        proxy_pass http://$recommendations_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/movies {
        set $catalog_service catalog:8000;
        proxy_pass http://$catalog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
